name: build-ipa

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Показать версию Xcode
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Собрать приложение (без подписи)
        run: |
          set -euo pipefail
          xcodebuild \
            -project WHOOSHTech.xcodeproj \
            -scheme WHOOSHTech \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковать .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/WHOOSHTech.app"
          test -d "$APP" || { echo "Не найден $APP"; ls -R build/Build/Products; exit 1; }
          rm -rf Payload WHOOSHTech.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WHOOSHTech.ipa Payload
          rm -rf Payload
          ls -lh WHOOSHTech.ipa
          shasum -a 256 WHOOSHTech.ipa

      - name: Загрузить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: WHOOSHTech-ipa
          path: WHOOSHTech.ipa
          if-no-files-found: error
